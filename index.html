<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio DesWeb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.4s ease; /* Efeito visual dinâmico no fundo */
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            color: #94a3b8;
            margin-bottom: 15px;
        }

        /* Área dinâmica para mostrar detalhes únicos de cada membro */
        #info-membro {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 25px;
            min-height: 30px;
            text-align: center;
            padding: 8px 16px;
            border-radius: 6px;
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
        }

        .botoes-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1 id="titulo">Escolha o profissional que vai mudar o seu futuro</h1>
    <p>Selecione um profissional para ver o portfólio:</p>
    
    <!-- Elemento que muda de texto dependendo do botão clicado -->
    <div id="info-membro">Selecione um membro abaixo para ver os detalhes</div>

    <div class="botoes-container">
        <button onclick="mudarPortfolio('analice')">Analice</button>
        <button onclick="mudarPortfolio('beatriz')">Beatriz</button>
        <button onclick="mudarPortfolio('catarina')">Catarina</button>
        <button onclick="mudarPortfolio('celso')">Celso</button>
        <button onclick="murus = null; mudarPortfolio('samuel')">Samuel</button>
    </div>

    <div class="video-container">
        <iframe src=""
                id="video"
                title="Portfólio"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen></iframe>   
    </div>

    <script>
        // "Banco de dados" local simulado diretamente no script JavaScript
        const dadosMembros = {
            analice: {
                videoUrl: "analice.mp4",
                texto: "✨ Analice - Markdown",
                corDestaque: "#ec4899" // Rosa
            },
            beatriz: {
                videoUrl: "beatriz.mp4",
                texto: "🚀 Beatriz - Read-me",
                corDestaque: "#8b5cf6" // Roxo
            },
            catarina: {
                videoUrl: "catarina.mp4",
                texto: "🎯 Catarina - Read-me",
                corDestaque: "#10b981" // Verde
            },
            celso: {
                videoUrl: "celso.mp4",
                texto: "⚙️ Celso - Backend",
                corDestaque: "#f59e0b" // Laranja
            },
            samuel: {
                videoUrl: "samuel.mp4",
                texto: "🛡️ Samuel - Frontend",
                corDestaque: "#06b6d4" // Ciano
            }
        };

        // Função única que lida com o clique e altera o frontend de forma personalizada
        function mudarPortfolio(membroKey) {
            const dados = dadosMembros[membroKey];
            const video = document.getElementById('video');
            const infoDiv = document.getElementById('info-membro');
            const titulo = document.getElementById('titulo');

            // 1. Muda o vídeo do iframe
            video.src = dados.videoUrl;

            // 2. Muda o texto descritivo do membro
            infoDiv.textContent = dados.texto;

            // 3. Efeito frontend extra: altera a cor da borda da caixinha de info dinamicamente
            infoDiv.style.borderColor = dados.corDestaque;
            
            // 4. Alerta visual sutil no título principal
            titulo.textContent = `Visualizando o portfólio de: ${membroKey.toUpperCase()}`;
        }
    </script>
        
</body>
</html>
